<!DOCTYPE html>
<html>
    <head>
        <meta charset = "UTF-8">
        <title>annoying captcha</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    </head>

    <body>
        <div class = "game-container">
            <header>
                <!-- Title and Satatus bars -->
                <h1 class= "game-title">The World's Most Annoying Captcha</h1>
                <div class = "status-bar">
                    <span>stage: <strong id="stage-count">0 / 14</strong></span>
                    <span>time: <strong id="timer-display">0.0s</strong></span>
                </div>
                
                <!-- description text -->
                <h2 class = "stage-header">Are you a robot, or a human?</h2>
                <p class = "stage-text">Press start to complete the Captcha verification in order to access the rest of the website.</p>

                <!-- redirect buttons, start begins the game, leaderboard goes to leaderboard page -->
                <a href="/game" class="button-link"><button type="button">Start</button></a>
                <a href="/leaderboard" class="button-link"><button type="button">Leaderboard</button></a>
                

                <!-- flavour text, joke contact info/ copy right-->
                <p  style="margin-top: 100px;">Captcha Game©©©©©©©©©©©</p>
                <p>Contact Info: </p>
                <p>please don't contact us</p>

            </header>
            
        </div>
    </body>
</html>
